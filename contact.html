<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact — Miomir Labs</title>
  <meta name="description" content="Contact Miomir Labs. We read every message.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bone: '#F9F7F2',
            'surface': '#fff8f7',
            'surface-container-lowest': '#ffffff',
            'surface-container-low': '#fdf1f0',
            'surface-container': '#f7ebea',
            'surface-container-high': '#f1e6e4',
            'surface-container-highest': '#ebe0df',
            'surface-dim': '#e2d8d6',
            'ink-black': '#111111',
            oxblood: '#2D0A0A',
            'technical-gray': '#8C8C8C',
            'on-surface-variant': '#514342',
            'hairline-stroke': 'rgba(45, 10, 10, 0.15)'
          },
          spacing: {
            'unit': '4px',
            'gutter': '24px',
            'margin-narrow': '48px',
            'margin-wide': '120px',
            'section-break': '80px'
          },
          fontFamily: {
            'display-xl': ['Bodoni Moda', 'Georgia', 'serif'],
            'headline-lg': ['Bodoni Moda', 'Georgia', 'serif'],
            'headline-lg-mobile': ['Bodoni Moda', 'Georgia', 'serif'],
            'body-md': ['Hanken Grotesk', 'system-ui', 'sans-serif'],
            'body-lg': ['Hanken Grotesk', 'system-ui', 'sans-serif'],
            'label-technical': ['JetBrains Mono', 'ui-monospace', 'monospace'],
            'index-marker': ['JetBrains Mono', 'ui-monospace', 'monospace']
          },
          fontSize: {
            'display-xl': ['72px', { lineHeight: '80px', letterSpacing: '-0.02em', fontWeight: '700' }],
            'headline-lg': ['48px', { lineHeight: '56px', fontWeight: '600' }],
            'headline-lg-mobile': ['32px', { lineHeight: '40px', fontWeight: '600' }],
            'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }],
            'body-lg': ['18px', { lineHeight: '28px', fontWeight: '400' }],
            'label-technical': ['12px', { lineHeight: '16px', letterSpacing: '0.05em', fontWeight: '500' }],
            'index-marker': ['10px', { lineHeight: '12px', fontWeight: '700' }]
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-bone text-ink-black font-body-md">

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <defs>
      <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
      <symbol id="icon-person" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></symbol>
      <symbol id="icon-arrow-forward" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
      <symbol id="icon-arrow-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="icon-ledger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M7 9h4M7 13h4M15 9h2M15 13h2"/></symbol>
      <symbol id="icon-solutions" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 21h18L12 3 3 21z"/><path d="M9 21l3-9 3 9"/></symbol>
      <symbol id="icon-enterprise" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></symbol>
      <symbol id="icon-contact" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 7l9 6 9-6"/></symbol>
    </defs>
  </svg>

  <header class="fixed top-0 w-full z-50 bg-bone/90 backdrop-blur-md border-b border-hairline-stroke pt-safe">
    <div class="h-16 flex items-center justify-between px-gutter">
      <a href="index.html" class="flex items-center gap-2 no-underline text-ink-black">
        <img src="assets/images/logo.svg" alt="Miomir Labs" class="h-8 w-8 object-contain" style="color:#111">
        <div class="flex flex-col">
          <span class="font-headline-lg-mobile text-[18px] tracking-tight">Miomir Labs</span>
          <span class="font-label-technical text-technical-gray -mt-1 uppercase">Lagos, Nigeria</span>
        </div>
      </a>
      <div class="flex items-center gap-4">
        <button class="w-10 h-10 flex items-center justify-center text-technical-gray hover:text-ink-black transition-colors" aria-label="Open menu">
          <svg class="w-6 h-6"><use href="#icon-menu"/></svg>
        </button>
        <div class="w-8 h-8 rounded-full border border-hairline-stroke bg-surface-container flex items-center justify-center">
          <svg class="w-[18px] h-[18px]"><use href="#icon-person"/></svg>
        </div>
      </div>
    </div>
  </header>

  <main class="relative w-full pt-16 pb-32 bg-bone">
    <div class="flex flex-col w-full px-gutter gap-margin-narrow">

      <!-- Header -->
      <section class="flex flex-col gap-4 mt-8">
        <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-oxblood">Contact</h1>
        <p class="font-body-md text-on-surface-variant max-w-md">
          Tell us what you are building. We read every message.
        </p>
      </section>

      <!-- Contact form -->
      <section class="flex flex-col gap-8 bg-surface-container-highest p-6 border-t-4 border-oxblood">
        <form class="flex flex-col gap-8" action="mailto:hello@miomir.labs" method="post" enctype="text/plain">
          <div class="flex flex-col gap-2">
            <label class="font-label-technical text-on-surface-variant uppercase" for="name">Name</label>
            <input class="bg-bone border border-hairline-stroke text-ink-black p-3 focus:outline-none focus:border-oxblood transition-colors w-full placeholder-technical-gray font-label-technical" id="name" placeholder="Your name" type="text" name="name">
          </div>
          <div class="flex flex-col gap-2">
            <label class="font-label-technical text-on-surface-variant uppercase" for="email">Email</label>
            <input class="bg-bone border border-hairline-stroke text-ink-black p-3 focus:outline-none focus:border-oxblood transition-colors w-full placeholder-technical-gray font-label-technical" id="email" placeholder="you@organization.com" type="email" name="email">
          </div>
          <div class="flex flex-col gap-2">
            <label class="font-label-technical text-on-surface-variant uppercase" for="organization">Organization</label>
            <input class="bg-bone border border-hairline-stroke text-ink-black p-3 focus:outline-none focus:border-oxblood transition-colors w-full placeholder-technical-gray font-label-technical" id="organization" placeholder="Your organization" type="text" name="organization">
          </div>
          <div class="flex flex-col gap-2">
            <label class="font-label-technical text-on-surface-variant uppercase" for="message">What are you working on?</label>
            <textarea class="bg-bone border border-hairline-stroke text-ink-black p-3 focus:outline-none focus:border-oxblood transition-colors w-full resize-none overflow-hidden placeholder-technical-gray font-label-technical" id="message" name="message" rows="4" placeholder="A short description of the project or problem..."></textarea>
          </div>
          <div class="border-t border-hairline-stroke pt-6 mt-2 flex justify-end">
            <button class="relative px-8 py-4 bg-oxblood text-bone font-label-technical uppercase tracking-widest transition-all active:scale-95 shadow-sm flex items-center gap-2 hover:bg-ink-black" type="submit">
              Send message
              <svg class="w-[18px] h-[18px]"><use href="#icon-arrow-forward"/></svg>
            </button>
          </div>
        </form>
      </section>

      <!-- Direct contact -->
      <section class="border-t border-hairline-stroke pt-8 flex flex-col gap-4">
        <h2 class="font-label-technical text-technical-gray uppercase">Direct</h2>
        <div class="flex flex-col gap-2">
          <a href="mailto:hello@miomir.labs" class="font-body-lg text-oxblood hover:underline">hello@miomir.labs</a>
          <p class="font-body-md text-on-surface-variant">Miomir Labs<br>Lagos, Nigeria</p>
        </div>
      </section>

    </div>
  </main>

  <footer class="fixed bottom-0 w-full z-50 pb-safe bg-bone/95 backdrop-blur-md border-t border-hairline-stroke">
    <div class="flex items-center justify-between h-14 px-gutter border-b border-hairline-stroke">
      <div class="flex items-center gap-3">
        <img src="assets/images/logo.svg" alt="" class="w-6 h-6 object-contain opacity-80" style="color:#111">
        <span class="font-label-technical text-ink-black uppercase">Miomir Labs</span>
      </div>
      <span class="font-label-technical text-technical-gray">UTC 14:42:08</span>
    </div>
    <nav class="flex justify-between items-center h-16 px-4" aria-label="Primary">
      <a href="index.html" class="flex flex-col items-center justify-center w-1/4 h-full text-technical-gray hover:text-ink-black transition-colors">
        <svg class="w-5 h-5"><use href="#icon-ledger"/></svg>
        <span class="font-label-technical mt-1">Home</span>
      </a>
      <a href="work.html" class="flex flex-col items-center justify-center w-1/4 h-full text-technical-gray hover:text-ink-black transition-colors">
        <svg class="w-5 h-5"><use href="#icon-solutions"/></svg>
        <span class="font-label-technical mt-1">Work</span>
      </a>
      <a href="enterprise.html" class="flex flex-col items-center justify-center w-1/4 h-full text-technical-gray hover:text-ink-black transition-colors">
        <svg class="w-5 h-5"><use href="#icon-enterprise"/></svg>
        <span class="font-label-technical mt-1">Enterprise</span>
      </a>
      <a href="contact.html" class="flex flex-col items-center justify-center w-1/4 h-full text-ink-black border-t-2 border-oxblood transition-colors" aria-current="page">
        <svg class="w-5 h-5"><use href="#icon-contact"/></svg>
        <span class="font-label-technical mt-1">Contact</span>
      </a>
    </nav>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
