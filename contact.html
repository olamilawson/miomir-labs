<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact — Miomir Labs</title>
  <meta name="description" content="Contact Miomir Labs. We read every message.">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-bone text-ink-black font-body-md">

  <header class="fixed top-0 w-full z-50 bg-bone/90 backdrop-blur-md border-b border-hairline-stroke pt-safe">
    <div class="h-16 flex items-center justify-between px-gutter">
      <a href="index.html" class="flex items-center gap-2 no-underline text-ink-black">
        <img src="assets/images/logo.svg" alt="Miomir Labs" class="h-8 w-8 object-contain" style="color:#111">
        <div class="flex flex-col">
          <span class="font-headline-lg-mobile text-[18px] tracking-tight">Miomir Labs</span>
          <span class="font-label-technical text-technical-gray -mt-1 uppercase">Lagos, Nigeria</span>
        </div>
      </a>
      <nav class="hidden md:flex items-center gap-8" aria-label="Primary">
        <a href="index.html" class="font-label-technical text-technical-gray hover:text-ink-black transition-colors uppercase">Home</a>
        <a href="work.html" class="font-label-technical text-technical-gray hover:text-ink-black transition-colors uppercase">Work</a>
        <a href="enterprise.html" class="font-label-technical text-technical-gray hover:text-ink-black transition-colors uppercase">Enterprise</a>
        <a href="contact.html" class="font-label-technical text-ink-black uppercase">Contact</a>
      </nav>
      <button class="md:hidden w-10 h-10 flex items-center justify-center text-technical-gray hover:text-ink-black transition-colors" aria-label="Open menu" aria-expanded="false" id="menuBtn">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
    <nav id="mobileNav" class="hidden md:hidden flex-col border-t border-hairline-stroke bg-bone px-gutter py-4 gap-4" aria-label="Primary mobile">
      <a href="index.html" class="font-label-technical text-technical-gray uppercase">Home</a>
      <a href="work.html" class="font-label-technical text-technical-gray uppercase">Work</a>
      <a href="enterprise.html" class="font-label-technical text-technical-gray uppercase">Enterprise</a>
      <a href="contact.html" class="font-label-technical text-ink-black uppercase">Contact</a>
    </nav>
  </header>

  <main class="relative w-full pt-16 bg-bone">

    <!-- Header -->
    <section class="px-gutter pt-10 pb-12 border-b border-hairline-stroke">
      <div class="max-w-[1280px] mx-auto flex flex-col gap-4">
        <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-oxblood">Contact</h1>
        <p class="font-body-md text-on-surface-variant max-w-md">
          Tell us what you are building. We read every message.
        </p>
      </div>
    </section>

    <!-- Contact form -->
    <section class="px-gutter py-section-break">
      <div class="max-w-[1280px] mx-auto">
        <form class="flex flex-col gap-8 bg-surface-container-highest p-6 border-t-4 border-oxblood max-w-2xl" action="mailto:hello@miomir.labs" method="post" enctype="text/plain">
          <div class="flex flex-col gap-2">
            <label class="font-label-technical text-on-surface-variant uppercase" for="name">Name</label>
            <input class="bg-bone border border-hairline-stroke text-ink-black p-3 focus:outline-none focus:border-oxblood transition-colors w-full placeholder-technical-gray font-label-technical" id="name" placeholder="Your name" type="text" name="name">
          </div>
          <div class="flex flex-col gap-2">
            <label class="font-label-technical text-on-surface-variant uppercase" for="email">Email</label>
            <input class="bg-bone border border-hairline-stroke text-ink-black p-3 focus:outline-none focus:border-oxblood transition-colors w-full placeholder-technical-gray font-label-technical" id="email" placeholder="you@organization.com" type="email" name="email">
          </div>
          <div class="flex flex-col gap-2">
            <label class="font-label-technical text-on-surface-variant uppercase" for="organization">Organization</label>
            <input class="bg-bone border border-hairline-stroke text-ink-black p-3 focus:outline-none focus:border-oxblood transition-colors w-full placeholder-technical-gray font-label-technical" id="organization" placeholder="Your organization" type="text" name="organization">
          </div>
          <div class="flex flex-col gap-2">
            <label class="font-label-technical text-on-surface-variant uppercase" for="message">What are you working on?</label>
            <textarea class="bg-bone border border-hairline-stroke text-ink-black p-3 focus:outline-none focus:border-oxblood transition-colors w-full resize-none overflow-hidden placeholder-technical-gray font-label-technical" id="message" name="message" rows="4" placeholder="A short description of the project or problem..."></textarea>
          </div>
          <div class="border-t border-hairline-stroke pt-6 mt-2 flex justify-end">
            <button class="relative px-8 py-4 bg-oxblood text-bone font-label-technical uppercase tracking-widest transition-all active:scale-95 shadow-sm flex items-center gap-2 hover:bg-ink-black" type="submit">
              Send message
              <span>→</span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- Direct contact -->
    <section class="px-gutter pb-section-break border-b border-hairline-stroke">
      <div class="max-w-[1280px] mx-auto flex flex-col gap-4">
        <h2 class="font-label-technical text-technical-gray uppercase">Direct</h2>
        <div class="flex flex-col gap-2">
          <a href="mailto:hello@miomir.labs" class="font-body-lg text-oxblood hover:underline">hello@miomir.labs</a>
          <p class="font-body-md text-on-surface-variant">Miomir Labs<br>Lagos, Nigeria</p>
        </div>
      </div>
    </section>

  </main>

  <footer class="bg-bone border-t border-hairline-stroke py-8 px-gutter">
    <div class="max-w-[1280px] mx-auto flex flex-col md:flex-row md:items-center justify-between gap-6">
      <div class="flex items-center gap-2">
        <img src="assets/images/logo.svg" alt="" class="w-6 h-6 object-contain" style="color:#111">
        <span class="font-label-technical text-ink-black uppercase">Miomir Labs</span>
      </div>
      <nav class="flex flex-wrap gap-6" aria-label="Footer">
        <a href="index.html" class="font-label-technical text-technical-gray hover:text-ink-black uppercase">Home</a>
        <a href="work.html" class="font-label-technical text-technical-gray hover:text-ink-black uppercase">Work</a>
        <a href="enterprise.html" class="font-label-technical text-technical-gray hover:text-ink-black uppercase">Enterprise</a>
        <a href="contact.html" class="font-label-technical text-technical-gray hover:text-ink-black uppercase">Contact</a>
      </nav>
      <div class="flex flex-col gap-1 font-label-technical text-technical-gray md:text-right">
        <a href="mailto:hello@miomir.labs" class="text-ink-black hover:underline">hello@miomir.labs</a>
        <span>Lagos, Nigeria</span>
      </div>
    </div>
  </footer>

  <script>
    const btn = document.getElementById('menuBtn');
    const nav = document.getElementById('mobileNav');
    btn.addEventListener('click', () => {
      const hidden = nav.classList.toggle('hidden');
      btn.setAttribute('aria-expanded', String(!hidden));
    });
  </script>
</body>
</html>
